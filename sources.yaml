- kind: helm
  repository: https://argoproj.github.io/argo-helm
  chart: argo-cd
  values: |
    crds:
      install: true
- kind: git
  repository: https://github.com/argoproj/argo-workflows.git
  path: manifests/base/crds/full
  revision: main
- kind: git
  repository: https://github.com/dexidp/dex.git
  path: scripts/manifests/crds
  revision: master
- kind: git
  repository: https://github.com/aws/eks-charts.git
  path: stable/aws-load-balancer-controller/crds
  revision: master
- kind: git
  repository: https://github.com/aws/eks-charts.git
  path: stable/aws-vpc-cni/crds
  revision: master
- kind: helm
  repository: https://charts.external-secrets.io
  chart: external-secrets
  values: |
    installCRDs: true
- kind: helm
  repository: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  values: |
    crds:
      enabled: true
